<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img">
<title>E07: optimizer memory</title>
<desc>A one-hot step at learning rate 1 overwrites one slot exactly, but a smaller step leaves a gap and neighbours drift.</desc>
