.e00-chip{stroke:var(--bg);stroke-width:1.5;opacity:0}
.e00-f0{fill:var(--s0)} .e00-f1{fill:var(--s1)} .e00-f2{fill:var(--s2)}
g.e00-f0,g.e00-f1,g.e00-f2{fill:none}
.e00-old{opacity:0} .e00-blue{opacity:0} .e00-green,.e00-orange{opacity:1}
.e00-erase{opacity:1}
.e00-w3{opacity:1}
.e00-rd{opacity:1;transform:translate(141px,-60px)}
.e00-bd3,.e00-ad3{opacity:1}
