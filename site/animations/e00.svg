<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img"><title>E00: memory</title><desc>Writes replace one slot's column of the state matrix, other slots stay unchanged, and a read returns the stored column.</desc><style>
.e00-t{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--muted)}
.e00-cell{fill:var(--cell-zero)}
