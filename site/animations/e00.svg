.e00-blue .e00-one{fill:var(--s0)}
.e00-orange .e00-one{fill:var(--s1)}
.e00-green .e00-one{fill:var(--s2)}
.e00-lane{stroke:var(--rule);stroke-width:1.5;stroke-dasharray:3 5}
