<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="e08-title e08-desc">
<title id="e08-title">E08: search with a verifier</title>
<desc id="e08-desc">A search flips one bit at a time and lowers an energy bar until zero, then an exact verifier accepts the assignment.</desc>
