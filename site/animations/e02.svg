<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="e02-title e02-desc">
<title id="e02-title">E02: learned interfaces</title>
<desc id="e02-desc">A text tool sends and receives strings of tokens appended to the context; a typed interface sends one typed action and receives one embedded value.</desc>
<style>
.e02-box { fill: var(--surface); stroke: var(--rule); stroke-width: 1.5; }
.e02-ring { fill: none; stroke: var(--accent); stroke-width: 2.5; opacity: 0; }
.e02-head { fill: var(--muted); font-family: var(--sans); font-size: 12px; font-weight: 600; }
.e02-name { fill: var(--text); font-family: var(--sans); font-size: 12px; font-weight: 600; text-anchor: middle; }
.e02-key { font-family: var(--sans); font-size: 11px; font-weight: 600; }
.e02-key-req { fill: var(--s0); }
.e02-key-rep { fill: var(--s1); }
.e02-track { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; opacity: 0.5; fill: none; }
.e02-arrow-req { fill: var(--s0); }
.e02-arrow-rep { fill: var(--s1); }
.e02-under { fill: var(--bg);
}
.e02-under-s { fill: var(--surface); stroke: none; }
.e02-divider { stroke: var(--rule); stroke-width: 1; }
.e02-cell { fill: var(--cell-zero); stroke: var(--rule); stroke-width: 1; }
.e02-cell-on { fill: var(--cell-one); }
.e02-req-tok { fill: var(--s0); fill-opacity: 0.18; stroke: var(--s0); stroke-width: 1.3; }
.e02-rep-tok { fill: var(--s1); fill-opacity: 0.18; stroke: var(--s1); stroke-width: 1.3; }
.e02-ctx { fill: var(--cell-zero); stroke: var(--muted); stroke-width: 1; }
.e02-ctx-new { fill: var(--s1); fill-opacity: 0.18; stroke: var(--s1); stroke-width: 1.3; }
.e02-chip { fill: var(--s0); fill-opacity: 0.18; stroke: var(--s0); stroke-width: 1.5; }
.e02-chip-op { fill: var(--s0); }
.e02-chip-arg { fill: none; stroke: var(--s0); stroke-width: 1.5; }
.e02-vec { fill: var(--s1); stroke: var(--s1); stroke-width: 1.3; }
.e02-vec-frame { fill: none; stroke: var(--s1); stroke-width: 1.3; stroke-dasharray: 3 2; }

.e02-req-t { animation: e02-req-t 8s ease-in-out infinite; }
.e02-rep-t { animation: e02-rep-t 8s ease-in-out infinite; }
.e02-req-v { animation: e02-req-v 8s ease-in-out infinite; }
.e02-rep-v { animation: e02-rep-v 8s ease-in-out infinite; }
.e02-ctx-in { animation: e02-ctx-in 8s ease-out infinite; }
.e02-slot-in { animation: e02-ctx-in 8s ease-out infinite; }
.e02-ring-m { animation: e02-ring-m 8s ease-in-out infinite; }
.e02-ring-c { animation: e02-ring-c 8s ease-in-out infinite; }
.e02-ring-s { animation: e02-ring-s 8s ease-in-out infinite; }
.e02-flip { animation: e02-flip 8s steps(1, end) infinite; }

@keyframes e02-req-t {
  0%, 6% { transform: translateX(0); opacity: 0; }
  10% { transform: translateX(0); opacity: 1; }
  38% { transform: translateX(332px); opacity: 1; }
  42%, 100% { transform: translateX(332px); opacity: 0; }
}
@keyframes e02-rep-t {
  0%, 48% { transform: translateX(0); opacity: 0; }
  52% { transform: translateX(0); opacity: 1; }
  78% { transform: translateX(-352px); opacity: 1; }
  80%, 100% { transform: translateX(-352px); opacity: 0; }
}
@keyframes e02-req-v {
  0%, 6% { transform: translateX(0); opacity: 0; }
  10% { transform: translateX(0); opacity: 1; }
  38% { transform: translateX(368px); opacity: 1; }
  42%, 100% { transform: translateX(368px); opacity: 0; }
}
@keyframes e02-rep-v {
  0%, 48% { transform: translateX(0); opacity: 0; }
  52% { transform: translateX(0); opacity: 1; }
  78% { transform: translateX(-354px); opacity: 1; }
  80%, 100% { transform: translateX(-354px); opacity: 0; }
}
@keyframes e02-ctx-in {
  0%, 77% { opacity: 0; }
  82%, 96% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes e02-ring-m {
  0%, 38% { opacity: 0; }
  42%, 48% { opacity: 1; }
  54%, 100% { opacity: 0; }
}
@keyframes e02-ring-c {
  0%, 78% { opacity: 0; }
  82%, 90% { opacity: 1; }
  96%, 100% { opacity: 0; }
}
@keyframes e02-ring-s {
  0%, 2% { opacity: 0; }
  6%, 12% { opacity: 1; }
  18%, 100% { opacity: 0; }
}
@keyframes e02-flip {
  0%, 41% { fill: var(--cell-zero); }
  42%, 96% { fill: var(--cell-one); }
  97%, 100% { fill: var(--cell-zero); }
}

@media (prefers-reduced-motion: reduce) {
  .e02-req-t, .e02-rep-t, .e02-req-v, .e02-rep-v, .e02-ctx-in, .e02-slot-in,
  .e02-ring-m, .e02-ring-c, .e02-ring-s, .e02-flip { animation: none; }
  .e02-ring { opacity: 0; }
}
</style>

<!-- Lane 1: text tool -->
<text class="e02-head" x="20" y="22">Text tool</text>
<g class="e02-key e02-key-req"><circle cx="498" cy="18" r="4" fill="var(--s0)"/><text class="e02-key e02-key-req" x="508" y="22">request</text></g>
<g><circle cx="568" cy="18" r="4" fill="var(--s1)"/><text class="e02-key e02-key-rep" x="578" y="22">reply</text></g>

<rect class="e02-box" x="20" y="38" width="90" height="72" rx="10"/>
<rect class="e02-ring e02-ring-c" x="20" y="38" width="90" height="72" rx="10"/>
<rect class="e02-ring e02-ring-s" x="20" y="38" width="90" height="72" rx="10"/>
<text class="e02-name" x="65" y="58">Controller</text>
<rect class="e02-ctx" x="28" y="84" width="12" height="14" rx="3"/>
<rect class="e02-ctx" x="43" y="84" width="12" height="14" rx="3"/>
<g class="e02-ctx-in">
  <rect class="e02-ctx-new" x="58" y="84" width="12" height="14" rx="3"/>
  <rect class="e02-ctx-new" x="73" y="84" width="12" height="14" rx="3"/>
  <rect class="e02-ctx-new" x="88" y="84" width="12" height="14" rx="3"/>
</g>

<rect class="e02-box" x="530" y="38" width="90" height="72" rx="10"/>
<rect class="e02-ring e02-ring-m" x="530" y="38" width="90" height="72" rx="10"/>
<text class="e02-name" x="575" y="58">Machine</text>
<rect class="e02-cell" x="547" y="84" width="12" height="14" rx="3"/>
<rect class="e02-cell e02-cell-on" x="562" y="84" width="12" height="14" rx="3"/>
<rect class="e02-cell e02-flip" x="577" y="84" width="12" height="14" rx="3"/>
<rect class="e02-cell" x="592" y="84" width="12" height="14" rx="3"/>

<line class="e02-track" x1="124" y1="60" x2="516" y2="60"/>
<line class="e02-track" x1="124" y1="91" x2="516" y2="91"/>
<path class="e02-arrow-req" d="M524 60 l-8 -4 v8 z"/>
<path class="e02-arrow-rep" d="M116 91 l8 -4 v8 z"/>

<g class="e02-req-t">
  <rect class="e02-under" x="118" y="53" width="16" height="14" rx="3"/><rect class="e02-req-tok" x="118" y="53" width="16" height="14" rx="3"/>
  <rect class="e02-under" x="138" y="53" width="16" height="14" rx="3"/><rect class="e02-req-tok" x="138" y="53" width="16" height="14" rx="3"/>
  <rect class="e02-under" x="158" y="53" width="16" height="14" rx="3"/><rect class="e02-req-tok" x="158" y="53" width="16" height="14" rx="3"/>
  <rect class="e02-under" x="178" y="53" width="16" height="14" rx="3"/><rect class="e02-req-tok" x="178" y="53" width="16" height="14" rx="3"/>
</g>
<g class="e02-rep-t">
  <rect class="e02-under" x="470" y="84" width="16" height="14" rx="3"/><rect class="e02-rep-tok" x="470" y="84" width="16" height="14" rx="3"/>
  <rect class="e02-under" x="490" y="84" width="16" height="14" rx="3"/><rect class="e02-rep-tok" x="490" y="84" width="16" height="14" rx="3"/>
  <rect class="e02-under" x="510" y="84" width="16" height="14" rx="3"/><rect class="e02-rep-tok" x="510" y="84" width="16" height="14" rx="3"/>
</g>

<line class="e02-divider" x1="20" y1="130" x2="620" y2="130"/>

<!-- Lane 2: typed interface -->
<text class="e02-head" x="20" y="152">Typed interface</text>

<rect class="e02-box" x="20" y="164" width="90" height="72" rx="10"/>
<rect class="e02-ring e02-ring-c" x="20" y="164" width="90" height="72" rx="10"/>
<rect class="e02-ring e02-ring-s" x="20" y="164" width="90" height="72" rx="10"/>
<text class="e02-name" x="65" y="184">Controller</text>
<rect class="e02-vec-frame" x="37" y="206" width="56" height="18" rx="4"/>
<g class="e02-slot-in">
  <rect class="e02-under-s" x="39" y="208" width="12" height="14" rx="2"/><rect class="e02-vec" x="39" y="208" width="12" height="14" rx="2" fill-opacity="1"/>
  <rect class="e02-under-s" x="53" y="208" width="12" height="14" rx="2"/><rect class="e02-vec" x="53" y="208" width="12" height="14" rx="2" fill-opacity="0.35"/>
  <rect class="e02-under-s" x="67" y="208" width="12" height="14" rx="2"/><rect class="e02-vec" x="67" y="208" width="12" height="14" rx="2" fill-opacity="0.7"/>
  <rect class="e02-under-s" x="81" y="208" width="12" height="14" rx="2"/><rect class="e02-vec" x="81" y="208" width="12" height="14" rx="2" fill-opacity="0.2"/>
</g>

<rect class="e02-box" x="530" y="164" width="90" height="72" rx="10"/>
<rect class="e02-ring e02-ring-m" x="530" y="164" width="90" height="72" rx="10"/>
<text class="e02-name" x="575" y="184">Machine</text>
<rect class="e02-cell" x="547" y="210" width="12" height="14" rx="3"/>
<rect class="e02-cell e02-cell-on" x="562" y="210" width="12" height="14" rx="3"/>
<rect class="e02-cell e02-flip" x="577" y="210" width="12" height="14" rx="3"/>
<rect class="e02-cell" x="592" y="210" width="12" height="14" rx="3"/>

<line class="e02-track" x1="124" y1="186" x2="516" y2="186"/>
<line class="e02-track" x1="124" y1="217" x2="516" y2="217"/>
<path class="e02-arrow-req" d="M524 186 l-8 -4 v8 z"/>
<path class="e02-arrow-rep" d="M116 217 l8 -4 v8 z"/>

<g class="e02-req-v">
  <rect class="e02-under" x="118" y="178" width="44" height="16" rx="8"/><rect class="e02-chip" x="118" y="178" width="44" height="16" rx="8"/>
  <rect class="e02-chip-op" x="122" y="182" width="20" height="8" rx="4"/>
  <circle class="e02-chip-arg" cx="151" cy="186" r="4"/>
</g>
<g class="e02-rep-v">
  <rect class="e02-under" x="472" y="210" width="12" height="14" rx="2"/><rect class="e02-vec" x="472" y="210" width="12" height="14" rx="2" fill-opacity="1"/>
  <rect class="e02-under" x="486" y="210" width="12" height="14" rx="2"/><rect class="e02-vec" x="486" y="210" width="12" height="14" rx="2" fill-opacity="0.35"/>
  <rect class="e02-under" x="500" y="210" width="12" height="14" rx="2"/><rect class="e02-vec" x="500" y="210" width="12" height="14" rx="2" fill-opacity="0.7"/>
  <rect class="e02-under" x="514" y="210" width="12" height="14" rx="2"/><rect class="e02-vec" x="514" y="210" width="12" height="14" rx="2" fill-opacity="0.2"/>
</g>
</svg>
