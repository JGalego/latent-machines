<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="e03-title e03-desc">
<title id="e03-title">E03: latent feedback</title>
<desc id="e03-desc">A machine step's result returns as text (T), a model-input vector (L), or a code to the heads (H); N stays native.</desc>
<style>
.e03-row.e03-T { --c: var(--s1); }
.e03-row.e03-L { --c: var(--s0); }
.e03-row.e03-S { --c: var(--s3); }
.e03-row.e03-H { --c: var(--s2); }
.e03-row.e03-N { --c: var(--s4); }
.e03-tag { fill: var(--c); font-family: var(--sans); font-size: 12px; font-weight: 700; }
.e03-col { fill: var(--muted); font-family: var(--sans); font-size: 11px; font-weight: 600; text-anchor: middle; }
.e03-box { fill: var(--surface); stroke: var(--rule); stroke-width: 1.5; }
.e03-slab { fill: var(--cell-zero); stroke: var(--rule); stroke-width: 1; }
.e03-slab-on { animation: e03-slab 8s linear infinite; animation-delay: var(--d); }
.e03-slot { fill: var(--c); fill-opacity: 0.55; stroke: var(--c); stroke-width: 1.3; }
.e03-slot-pop { fill-opacity: 0; stroke-opacity: 0; animation: e03-pop 8s ease-out infinite; animation-delay: var(--d); transform-box: fill-box; transform-origin: center; }
.e03-cell { fill: var(--cell-zero); stroke: var(--rule); stroke-width: 1; }
.e03-cell-on { fill: var(--cell-one); }
.e03-wire-s { fill: none; stroke: var(--muted); stroke-width: 1.5; opacity: 0.6; }
.e03-head-s { fill: var(--muted); opacity: 0.6; }
.e03-wire { fill: none; stroke: var(--c); stroke-width: 1.5; stroke-dasharray: 4 3; opacity: 0.7; }
.e03-head { fill: var(--c); }
.e03-glow { fill: var(--c); opacity: 0; animation: e03-glow 8s ease-out infinite; animation-delay: var(--d); }
.e03-glow-m { fill: var(--accent); }
.e03-pulse { fill: none; stroke: var(--c); stroke-width: 4; stroke-linecap: butt; stroke-dasharray: 8 130; stroke-dashoffset: 8; animation: e03-run 8s linear infinite; animation-delay: var(--d); }
.e03-pulse-f { stroke: var(--text); }

@keyframes e03-run {
  0% { stroke-dashoffset: 8; }
  18%, 100% { stroke-dashoffset: -100; }
}
@keyframes e03-glow {
  0% { opacity: 0; }
  4% { opacity: 0.4; }
  20%, 100% { opacity: 0; }
}
@keyframes e03-slab {
  0% { fill: var(--cell-zero); }
  5% { fill: var(--c); }
  18%, 100% { fill: var(--cell-zero); }
}
@keyframes e03-pop {
  0% { transform: scale(1); fill-opacity: 0; stroke-opacity: 0; }
  5% { transform: scale(1.7); fill-opacity: 0.9; stroke-opacity: 1; }
  18%, 100% { transform: scale(1); fill-opacity: 0; stroke-opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .e03-slab-on, .e03-slot-pop, .e03-glow, .e03-pulse { animation: none; }
  .e03-slot-pop { display: none; }
  .e03-wire { stroke-dasharray: none; opacity: 0.9; }
}
</style>
<text class="e03-col" x="210" y="18">Model</text><text class="e03-col" x="406" y="18">Heads</text><text class="e03-col" x="565" y="18">Machine</text>
