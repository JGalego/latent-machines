[project]
name = "latent-machines"
version = "0.1.0"
description = "Neural models as programmable machines."
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "João Galego" }]
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
torch-cpu = [
    "torch>=2.15.0",
]
lm = [
    "transformers>=5.23",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

# CPU-only PyTorch wheels; the default PyPI wheels bundle CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# HTML templates are clearer unwrapped than split across string fragments.
"site/build.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
