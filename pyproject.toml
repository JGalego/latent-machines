[project]
name = "latent-machines"
version = "0.1.0"
description = "Neural models as programmable machines."
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "João Galego" }]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
